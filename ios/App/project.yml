name: CmodemApp
options:
  bundleIdPrefix: com.fhcpeboard
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  CmodemCore:
    path: ..

targets:
  CmodemApp:
    type: application
    platform: iOS
    sources:
      - path: CmodemApp/Sources
      - path: CmodemApp/Assets
        type: resource
    dependencies:
      - package: CmodemCore
        product: CmodemCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fhcpeboard.ios
        MARKETING_VERSION: "1.4.3"
        CURRENT_PROJECT_VERSION: "52"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Air6 APP
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Air6 APP
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: "用于连接局域网内的 Air6 设备管理页面（192.168.x.x）。"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false

schemes:
  CmodemApp:
    build:
      targets:
        CmodemApp: all
    run:
      config: Debug
