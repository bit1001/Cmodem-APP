name: iOS

permissions:
  contents: write

on:
  push:
    branches: [main, ios-port]
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: ios
        run: swift test --parallel

  build-app:
    needs: core-tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios/App
        run: xcodegen generate
      - name: Build (unsigned, simulator)
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/CmodemApp.xcodeproj \
            -scheme CmodemApp \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build-sim.log 2>&1 || { tail -100 build-sim.log; exit 1; }
          tail -5 build-sim.log
      - name: Collect app bundle
        run: |
          APP=$(find build/Build/Products -name "CmodemApp.app" -maxdepth 3 | head -1)
          echo "APP=$APP"
          mkdir -p artifacts
          if [ -n "$APP" ]; then cp -R "$APP" artifacts/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: CmodemApp-simulator-app
          path: artifacts
          if-no-files-found: warn

  build-ipa:
    needs: core-tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios/App
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/CmodemApp.xcodeproj \
            -scheme CmodemApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { tail -100 build.log; exit 1; }
          tail -5 build.log

      - name: Package IPA (assert the binary exists)
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/CmodemApp.app"
          test -f "$APP/CmodemApp" || { echo "missing executable in $APP"; ls -la "$APP"; exit 1; }
          file "$APP/CmodemApp"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry CmodemApp-unsigned.ipa Payload
          ls -lh CmodemApp-unsigned.ipa

      - name: Commit build log on failure
        if: failure()
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          tail -250 build.log > ci-build.log 2>/dev/null || echo "no build.log" > ci-build.log
          git add ci-build.log; git commit -m "ci: build failure log [skip ci]" || true
          git push || true

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cmodem-ios-latest
          name: CmodemApp (unsigned iOS)
          body: |
            由 GitHub Actions 构建的未签名 IPA，与 Android 版 1.4.3-local-52 使用同一套 HTML/JS 资源。
            请用 AltStore / Sideloadly 自签安装；首次启动需允许本地网络访问。
          files: CmodemApp-unsigned.ipa
          make_latest: false

      - uses: actions/upload-artifact@v4
        with:
          name: CmodemApp-unsigned-ipa
          path: CmodemApp-unsigned.ipa
          retention-days: 14
